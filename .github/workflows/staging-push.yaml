name: Build and push the latest build to staging

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: eur-lex-mcp-server
  GCP_REGISTRY: europe-west9-docker.pkg.dev/devops-gke-5d6634/ask-registry

jobs:
  test:
    uses: ./.github/workflows/checks.yaml

  publish-staging:
    environment: staging
    runs-on: ubuntu-22.04
    needs: test
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA and app version
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "app_version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Print image version
        run: echo Publishing version ${{ steps.vars.outputs.app_version }} \(${{ steps.vars.outputs.sha_short }}\)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west9-docker.pkg.dev --quiet

      - name: Build and push to GCP Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.app_version }}
          tags: |
            ${{ env.GCP_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.GCP_REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # deploy-staging (gitops image-tag bump + rollout wait, as in the other
  # projects) goes here once the helm chart and gitops Application exist.
